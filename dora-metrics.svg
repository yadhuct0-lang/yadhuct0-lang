<svg width="560" height="230" viewBox="0 0 560 230" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="560" height="230" rx="8" fill="#0d1117" stroke="#00ff41" stroke-opacity="0.3"/>

  <text x="20" y="30" font-family="JetBrains Mono, monospace" font-size="14" fill="#00ff41">
    $ ./deploy_metrics.sh --dora
    <animate attributeName="opacity" values="0;1" dur="0.6s" fill="freeze"/>
  </text>

  <!-- Deployment Frequency -->
  <text x="20" y="70" font-family="JetBrains Mono, monospace" font-size="12" fill="#c9d1d9">DEPLOYMENT FREQUENCY</text>
  <text x="480" y="70" font-family="JetBrains Mono, monospace" font-size="12" fill="#00ff41">Daily</text>
  <rect x="20" y="78" width="420" height="10" rx="5" fill="#161b22"/>
  <rect x="20" y="78" height="10" rx="5" fill="#00ff41">
    <animate attributeName="width" from="0" to="336" dur="1.4s" begin="0.2s" fill="freeze"/>
  </rect>

  <!-- Change Failure Rate -->
  <text x="20" y="110" font-family="JetBrains Mono, monospace" font-size="12" fill="#c9d1d9">CHANGE FAILURE RATE</text>
  <text x="480" y="110" font-family="JetBrains Mono, monospace" font-size="12" fill="#00ff41">Low</text>
  <rect x="20" y="118" width="420" height="10" rx="5" fill="#161b22"/>
  <rect x="20" y="118" height="10" rx="5" fill="#00ff41">
    <animate attributeName="width" from="0" to="126" dur="1.4s" begin="0.5s" fill="freeze"/>
  </rect>

  <!-- MTTR -->
  <text x="20" y="150" font-family="JetBrains Mono, monospace" font-size="12" fill="#c9d1d9">MEAN TIME TO RECOVERY</text>
  <text x="480" y="150" font-family="JetBrains Mono, monospace" font-size="12" fill="#00ff41">&lt; 1hr</text>
  <rect x="20" y="158" width="420" height="10" rx="5" fill="#161b22"/>
  <rect x="20" y="158" height="10" rx="5" fill="#00ff41">
    <animate attributeName="width" from="0" to="210" dur="1.4s" begin="0.8s" fill="freeze"/>
  </rect>

  <!-- Automation Coverage -->
  <text x="20" y="190" font-family="JetBrains Mono, monospace" font-size="12" fill="#c9d1d9">AUTOMATION COVERAGE</text>
  <text x="480" y="190" font-family="JetBrains Mono, monospace" font-size="12" fill="#00ff41">Rising</text>
  <rect x="20" y="198" width="420" height="10" rx="5" fill="#161b22"/>
  <rect x="20" y="198" height="10" rx="5" fill="#00ff41">
    <animate attributeName="width" from="0" to="294" dur="1.4s" begin="1.1s" fill="freeze"/>
  </rect>

  <!-- blinking cursor -->
  <rect x="300" y="20" width="7" height="14" fill="#00ff41">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
